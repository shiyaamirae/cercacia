name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # predicate-quantifier: without this, paths-filter's default "some" mode
      # OR's the pattern list together — '**' alone matches every file, so the
      # '!**/*.md' exclusion below is silently ignored and `code` is always
      # true. 'every' requires a file to match '**' AND not match '**/*.md',
      # which is the AND-then-subtract semantics this filter was written to
      # express. ('some-with-excludes', the other documented fix for this
      # exact pattern, isn't valid on this pinned dorny/paths-filter@v3 —
      # confirmed live via the action's own error: "Valid values: every,
      # some".) Confirmed live: a real doc-only PR (#16) ran the full verify
      # job anyway before this fix was added.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # Workflow still triggers on every push/PR — only the job is skipped for
  # doc-only changes. A skipped required job satisfies a required status
  # check; a workflow that never triggers (paths-ignore) does not, and would
  # leave the PR permanently stuck on "Expected — waiting for status".
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
